name: "Build Zola site for GitHub Pages"
description: "Build a Zola site"

inputs:
  zola_version:
    description: "Zola version tag (e.g. v0.22.0)"
    required: false

build_flags:
    description: "Extra flags passed to `zola build`"
    required: false
    default: ""

  check_links:
    description: "Run `zola check` before building"
    required: false
    default: "false"

  check_flags:
    description: "Extra flags passed to `zola check`"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate Zola version
      if : inputs.zola_version != ''
      shell: bash
      run: |
        set -euo pipefail
        v="${{ inputs.zola_version }}"
        if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
          echo "Invalid zola_version: '$v' (expected e.g. 0.22.0)" >&2
          exit 1
        fi
  
    - name: Install Zola with version
      if: inputs.zola_version != ''
      uses: taiki-e/install-action@v2
      with:
        tool: zola@${{ inputs.zola_version }}

    - name: Install latest Zola
      if: inputs.zola_version == ''
      uses: taiki-e/install-action@v2
      with:
        tool: zola

    - name: Build site with Zola
      shell: bash
      run: |
        set -euo pipefail
        version=$(zola --version)
        echo "Using zola version: $version"

        if [[ "${{ inputs.check_links }}" == "true" ]]; then
          zola check ${{ inputs.check_flags }}
        fi

        zola build ${{ inputs.build_flags }}
